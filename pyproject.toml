[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ohsb"
version = "0.1.0"
description = "Human sensing inference benchmark for NVIDIA Jetson Orin (MediaPipe Tasks)"
readme = "README.md"
requires-python = ">=3.8"   # JetPack 5.1.1 ships Python 3.8.10
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Kept out of the base deps on purpose so the harness imports and tests without
# it. The version split is not cosmetic — see docs/orin-setup.md:
#   * cp38 aarch64 wheels stop at 0.10.9; 0.10.13+ dropped the cp38 tag.
#   * 1.0.x ships py3-none-manylinux_2_28_aarch64, which pip on Python 3.8
#     considers installable (Ubuntu 20.04 has glibc 2.31 >= 2.28). It installs
#     and then fails at import, so 3.8 must be pinned rather than lower-bounded.
mediapipe = [
    "mediapipe==0.10.9; python_version < '3.9'",
    "mediapipe>=0.10.14; python_version >= '3.9'",
]
# On the Orin, OpenCV comes from JetPack (4.5.4, system python3-opencv) — do NOT
# pip install it there. This extra is for dev machines only.
video = ["opencv-python>=4.8"]
# jetson-stats provides jtop, the preferred (sudo-free) power backend on-board.
jetson = ["jetson-stats>=4.2"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
ohsb = "ohsb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ohsb"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The board runs Python 3.8.10 (JetPack 5.1.1). `from __future__ import
# annotations` makes ruff think PEP 585/604 syntax is safe, but keeping the
# explicit typing imports means nothing breaks if an annotation is ever
# evaluated at runtime on 3.8.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
